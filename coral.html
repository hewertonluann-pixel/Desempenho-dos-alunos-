<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <link rel="manifest" href="/manifest-coral.json">
  <title>Coral Kadosh — Controle de Frequência</title>
  <style>
    :root{--bg:#0b0714;--panel:#171026;--panel2:#21163a;--line:#3b2561;--ink:#f5f3ff;--muted:#b7a9d3;--purple:#a78bfa;--pink:#f472b6;--green:#34d399;--red:#fb7185}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#2b1550 0,#0b0714 42%);color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100vh}
    button,input,select{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.login-box{width:min(420px,100%);background:rgba(23,16,38,.95);border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:0 24px 80px #0008}.brand{text-align:center}.brand-mark{font-size:3rem}.brand h1{margin:8px 0 4px;font-size:1.45rem}.brand p{margin:0 0 26px;color:var(--muted);font-size:.9rem}.field{margin:14px 0}.field label{display:block;color:var(--muted);font-size:.8rem;margin-bottom:6px}.field input{width:100%;background:#0e0919;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px}.btn{border:0;border-radius:11px;padding:12px 16px;cursor:pointer;font-weight:700;transition:.15s;touch-action:manipulation}.btn:active{transform:scale(.97)}.btn-primary{background:linear-gradient(135deg,#8b5cf6,#db2777);color:#fff;width:100%}.error{color:#fda4af;font-size:.85rem;margin-top:12px;min-height:20px}.app{max-width:1100px;margin:auto;padding:18px 18px 44px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}.topbar h1{font-size:1.35rem;margin:0}.topbar small{display:block;color:var(--muted);margin-top:4px}.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.selector{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:18px}.selector label{color:var(--muted);font-size:.8rem;display:block;margin-bottom:7px}.selector select{width:100%;background:#0e0919;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px}.grid-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.action{background:linear-gradient(145deg,#21163a,#171026);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:left;color:var(--ink);cursor:pointer;min-height:145px}.action:hover{border-color:var(--purple);transform:translateY(-2px)}.action strong{display:block;font-size:1.05rem;margin:12px 0 6px}.action span{color:var(--muted);font-size:.82rem;line-height:1.4}.action .icon{font-size:1.8rem}.section{background:rgba(23,16,38,.9);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section h2{font-size:1rem;margin:0}.calls{display:grid;gap:10px}.call,.student{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px;background:#110b20;border:1px solid #30204c;border-radius:12px}.call-info strong,.student strong{display:block}.call-info small,.student small{color:var(--muted)}.call-actions{display:flex;gap:8px;flex-wrap:wrap}.btn-small{padding:8px 11px;font-size:.78rem}.btn-open{background:#6d28d9;color:#fff}.btn-danger{background:#4c172d;color:#fecdd3;border:1px solid #7f1d3d}.student-list{display:grid;gap:8px}.student-name{flex:1}.add-form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:14px}.add-form input{min-width:0;background:#0e0919;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px}.btn-add{background:#059669;color:#fff}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.status{color:var(--green);font-size:.84rem;min-height:20px;margin-top:10px}@media(max-width:700px){.grid-actions{grid-template-columns:1fr}.action{min-height:auto}.topbar{align-items:flex-start}.topbar h1{font-size:1.1rem}.add-form{grid-template-columns:1fr}.call,.student{align-items:flex-start;flex-direction:column}.call-actions{width:100%}.call-actions .btn{flex:1}}
  </style>
</head>
<body>
  <section id="login" class="login">
    <div class="login-box">
      <div class="brand"><div class="brand-mark">🎤</div><h1>Coral Kadosh</h1><p>Controle de Frequência</p></div>
      <div class="field"><label for="loginNome">Nome de acesso</label><input id="loginNome" autocomplete="username" placeholder="Digite seu nome"></div>
      <div class="field"><label for="loginSenha">Senha</label><input id="loginSenha" type="password" autocomplete="current-password" placeholder="Digite sua senha"></div>
      <button id="btnLogin" class="btn btn-primary">Entrar no painel</button><div id="loginErro" class="error" role="alert"></div>
    </div>
  </section>

  <main id="app" class="app hidden">
    <header class="topbar"><div><h1>🎤 Coral Kadosh</h1><small>Controle de Frequência</small></div><button id="btnSair" class="btn btn-ghost">Sair</button></header>
    <div class="selector"><label for="coralSelect">Turma Coral</label><select id="coralSelect"></select></div>
    <section class="grid-actions">
      <button class="action" id="btnFazer"><div class="icon">✅</div><strong>Fazer chamada</strong><span>Registrar a presença dos membros do Coral.</span></button>
      <button class="action" id="btnChamadas"><div class="icon">📋</div><strong>Gerenciar chamadas</strong><span>Consultar, abrir e excluir chamadas do Coral.</span></button>
      <button class="action" id="btnAlunos"><div class="icon">👥</div><strong>Gerenciar alunos</strong><span>Adicionar, consultar e remover membros do Coral.</span></button>
    </section>
    <section id="secChamadas" class="section hidden"><div class="section-head"><h2>📋 Chamadas do Coral</h2><button id="btnAtualizarChamadas" class="btn btn-ghost btn-small">Atualizar</button></div><div id="listaChamadas" class="calls"></div></section>
    <section id="secAlunos" class="section hidden"><div class="section-head"><h2>👥 Membros do Coral</h2></div><div class="add-form"><input id="novoNome" placeholder="Nome do novo aluno"><input id="novoInstrumento" placeholder="Instrumento"><button id="btnAdicionar" class="btn btn-add">Novo aluno</button></div><div class="add-form" style="grid-template-columns:1fr auto"><input id="buscaExistente" placeholder="Adicionar aluno já cadastrado..."><button id="btnAdicionarExistente" class="btn btn-open">Adicionar existente</button></div><div id="listaAlunos" class="student-list"></div><div id="status" class="status"></div></section>
  </main>

  <script type="module">
    import { db } from "./firebase-config.js";
    import { collection, query, where, getDocs, getDoc, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
    import { salvarUsuarioAtual } from "./auth.js";
    const $ = id => document.getElementById(id);
    let turmas=[], turma=null, alunos=[];
    const login = $('login'), app = $('app');
    function hoje(){return new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()).split('/').reverse().join('-')}
    function setAtiva(){localStorage.setItem('turmaAtiva',JSON.stringify({id:turma.id,nome:turma.nome,tipo:'coral',alunos:turma.alunos||[]}));}
    async function autenticar(){
      const nome=$('loginNome').value.trim(), senha=$('loginSenha').value.trim(); $('loginErro').textContent='';
      if(!nome||!senha){$('loginErro').textContent='Preencha nome e senha.';return}
      $('btnLogin').disabled=true;
      try{
        const snapProf=await getDocs(query(collection(db,'usuarios'),where('nome','==',nome)));
        if(!snapProf.empty){
          const u=snapProf.docs[0].data();
          if(u.senha!==senha){$('loginErro').textContent='Senha incorreta.';return}
          salvarUsuarioAtual(u.nome,'professor'); sessionStorage.setItem('coralLogado','1'); entrar(); return;
        }
        // Mesmo fluxo do index: primeiro login/apelido, depois nome completo.
        let snapAluno=await getDocs(query(collection(db,'alunos'),where('login','==',nome)));
        if(snapAluno.empty) snapAluno=await getDocs(query(collection(db,'alunos'),where('nome','==',nome)));
        if(snapAluno.empty){$('loginErro').textContent='Usuário não encontrado.';return}
        const alunoDoc=snapAluno.docs[0], aluno=alunoDoc.data();
        if(aluno.senha!==senha){$('loginErro').textContent='Senha incorreta.';return}
        if(aluno.classificado!==true){$('loginErro').textContent='Este acesso é exclusivo para usuários classificados.';return}
        salvarUsuarioAtual(aluno.nome,'aluno',true,alunoDoc.id); sessionStorage.setItem('coralLogado','1'); entrar();
      }catch(e){console.error(e);$('loginErro').textContent='Erro de conexão. Tente novamente.'}finally{$('btnLogin').disabled=false}
    }
    async function entrar(){login.classList.add('hidden');app.classList.remove('hidden');await carregarTurmas()}
    async function carregarTurmas(){const snap=await getDocs(query(collection(db,'turmas'),where('tipo','==','coral')));turmas=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));const select=$('coralSelect');select.innerHTML=turmas.length?turmas.map(t=>`<option value="${t.id}">${t.nome}</option>`).join(''):'<option>Nenhuma turma Coral cadastrada</option>';const antiga=JSON.parse(localStorage.getItem('turmaAtiva')||'null');turma=turmas.find(t=>t.id===antiga?.id)||turmas[0]||null;if(turma){select.value=turma.id;setAtiva();await carregarDados()}}
    $('coralSelect').addEventListener('change',async e=>{turma=turmas.find(t=>t.id===e.target.value);setAtiva();await carregarDados()});
    async function carregarDados(){if(!turma)return;const t=await getDoc(doc(db,'turmas',turma.id));if(t.exists())turma={id:t.id,...t.data()};setAtiva();await carregarAlunos();if(!$('secChamadas').classList.contains('hidden'))await carregarChamadas()}
    async function carregarAlunos(){const ids=new Set(turma.alunos||[]), snap=await getDocs(collection(db,'alunos'));alunos=snap.docs.filter(d=>(ids.has(d.id)||d.data().turmaId===turma.id)&&d.data().ativo!==false).map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));$('listaAlunos').innerHTML=alunos.length?alunos.map(a=>`<div class="student"><div class="student-name"><strong>${a.nome}</strong><small>${a.instrumento||'Instrumento não informado'}${a.turmaNome?' · turma principal: '+a.turmaNome:''}</small></div><button class="btn btn-danger btn-small" data-remove="${a.id}">Remover</button></div>`).join(''):'<div class="empty">Nenhum membro cadastrado no Coral.</div>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removerAluno(b.dataset.remove))}
    async function adicionarAluno(){if(!turma)return;const nome=$('novoNome').value.trim(), instrumento=$('novoInstrumento').value.trim();if(!nome||!instrumento){$('status').textContent='Informe nome e instrumento.';return}try{const ref=await addDoc(collection(db,'alunos'),{nome,instrumento,foto:'',leituraNome:'Bona',metodoNome:'Método',leitura:1,metodo:1,energia:100,frequenciaMensal:{porcentagem:0},frequenciaAnual:{},conquistas:[],classificado:false,senha:'asafe',turmaId:'',turmaNome:'',criadoEm:new Date().toISOString()});await updateDoc(doc(db,'turmas',turma.id),{alunos:[...(turma.alunos||[]),ref.id]});turma.alunos=[...(turma.alunos||[]),ref.id];$('novoNome').value='';$('novoInstrumento').value='';$('status').textContent='Aluno criado e adicionado ao Coral.';await carregarAlunos()}catch(e){console.error(e);$('status').textContent='Erro ao adicionar aluno.'}}
    async function adicionarExistente(){if(!turma)return;const busca=$('buscaExistente').value.trim().toLowerCase();if(!busca){$('status').textContent='Informe o nome ou login do aluno.';return}const snap=await getDocs(collection(db,'alunos'));const membroIds=new Set(turma.alunos||[]);const encontrado=snap.docs.map(d=>({id:d.id,...d.data()})).find(a=>!membroIds.has(a.id)&&((a.nome||'').toLowerCase()===busca||(a.login||'').toLowerCase()===busca));if(!encontrado){$('status').textContent='Aluno existente não encontrado.';return}const novos=[...(turma.alunos||[]),encontrado.id];await updateDoc(doc(db,'turmas',turma.id),{alunos:novos});turma.alunos=novos;$('buscaExistente').value='';$('status').textContent=`${encontrado.nome} adicionado ao Coral; turma principal preservada.`;await carregarAlunos()}
    async function removerAluno(id){if(!confirm('Remover este aluno somente do Coral?'))return;await updateDoc(doc(db,'turmas',turma.id),{alunos:(turma.alunos||[]).filter(x=>x!==id)});turma.alunos=(turma.alunos||[]).filter(x=>x!==id);await carregarAlunos();$('status').textContent='Aluno removido do Coral. A turma principal foi preservada.'}
    async function carregarChamadas(){if(!turma)return;const snap=await getDocs(query(collection(db,'eventos'),where('turmaId','==',turma.id)));const eventos=snap.docs.map(d=>({id:d.id,...d.data()})).filter(e=>e.tipo==='coral'||e.turmaId===turma.id).sort((a,b)=>(b.data||'').localeCompare(a.data||''));$('listaChamadas').innerHTML=eventos.length?eventos.map(e=>{const p=e.presencas||[],presentes=p.filter(x=>x.presenca==='presente').length;return `<div class="call"><div class="call-info"><strong>📅 ${e.data?e.data.split('-').reverse().join('/'):'Sem data'}</strong><small>${presentes}/${p.length} presentes${e.observacoes?' · '+e.observacoes:''}</small></div><div class="call-actions"><button class="btn btn-open btn-small" data-open="${e.id}">Abrir chamada</button><button class="btn btn-danger btn-small" data-delete="${e.id}">Excluir</button></div></div>`}).join(''):'<div class="empty">Nenhuma chamada do Coral encontrada.</div>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{setAtiva();location.href='ensaio.html?id='+b.dataset.open+'&origem=coral'});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>excluirChamada(b.dataset.delete))}
    async function fazerChamada(){if(!turma){alert('Nenhuma turma Coral cadastrada.');return}setAtiva();location.href='ensaio2.html'}
    async function excluirChamada(id){if(!confirm('Excluir esta chamada do Coral?'))return;await deleteDoc(doc(db,'eventos',id));await carregarChamadas()}
    $('btnLogin').onclick=autenticar;$('loginSenha').onkeydown=e=>{if(e.key==='Enter')autenticar()};$('btnSair').onclick=()=>{sessionStorage.removeItem('coralLogado');app.classList.add('hidden');login.classList.remove('hidden')};$('btnFazer').onclick=fazerChamada;$('btnChamadas').onclick=async()=>{$('secChamadas').classList.remove('hidden');$('secAlunos').classList.add('hidden');await carregarChamadas()};$('btnAtualizarChamadas').onclick=carregarChamadas;$('btnAlunos').onclick=async()=>{$('secAlunos').classList.remove('hidden');$('secChamadas').classList.add('hidden');await carregarAlunos()};$('btnAdicionar').onclick=adicionarAluno;$('btnAdicionarExistente').onclick=adicionarExistente;
    if(sessionStorage.getItem('coralLogado')==='1')entrar();
    if('serviceWorker' in navigator)navigator.serviceWorker.register('/service-worker.js').catch(console.error);
  </script>
</body>
</html>
