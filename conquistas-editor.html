<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar ícones das conquistas</title>
  <style>
    :root{color-scheme:dark;--bg:#080d1c;--card:#111a2d;--line:#263653;--text:#e6eefb;--muted:#9aabc5;--accent:#22d3ee;--ok:#4ade80;--danger:#fb7185}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 10% 0%,#142847 0,#080d1c 46%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
    main{width:min(1100px,calc(100% - 28px));margin:28px auto 60px}.topo{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.topo h1{margin:0;font-size:clamp(1.35rem,3vw,2rem);color:var(--accent)}.topo p{color:var(--muted);margin:6px 0 0}.voltar{color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-decoration:none;background:#101b30;white-space:nowrap}.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.card{background:linear-gradient(145deg,#142039,#0d1527);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}.preview{width:72px;height:72px;border-radius:12px;background:#07101f;border:1px dashed #3a5277;display:flex;align-items:center;justify-content:center;overflow:hidden}.preview img{width:100%;height:100%;object-fit:contain}.placeholder{font-size:2rem;color:#506583}.nome{font-weight:750;margin-bottom:4px}.desc{font-size:.8rem;color:var(--muted);min-height:34px}.acoes{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.arquivo{max-width:100%;font-size:.78rem;color:var(--muted)}button{border:0;border-radius:9px;padding:9px 12px;font:inherit;cursor:pointer;background:#155e75;color:#fff}button:disabled{opacity:.55;cursor:wait}.remover{background:#7f1d35}.status{font-size:.76rem;color:var(--muted);min-height:18px}.status.ok{color:var(--ok)}.status.err{color:var(--danger)}.salvar-todos{margin:0 0 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.nota{color:var(--muted);font-size:.85rem}.barra{height:5px;background:#0a1221;border-radius:4px;overflow:hidden;margin:10px 0 22px}.barra i{display:block;width:0;height:100%;background:var(--accent);transition:width .2s}
    @media(max-width:560px){.topo{align-items:flex-start;flex-direction:column}.card{grid-template-columns:60px 1fr}.preview{width:60px;height:60px}}
  </style>
</head>
<body>
<main>
  <header class="topo"><div><h1>🏆 Ícones das conquistas</h1><p>Envie um PNG para cada troféu. O painel do aluno padroniza as imagens em uma área de tamanho uniforme.</p></div><a class="voltar" href="professor.html">← Voltar ao professor</a></header>
  <div class="salvar-todos"><span class="nota">Formato recomendado: PNG quadrado, fundo transparente, até 2 MB.</span><span id="statusGeral" class="status"></span></div>
  <div class="barra"><i id="barraProgresso"></i></div>
  <section class="grade" id="gradeConquistas"><p>Carregando conquistas...</p></section>
</main>
<script type="module">
import { db } from "./firebase-config.js";
import { collection, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-storage.js";
import { regrasDeConquistas } from "./conquistas.js";
const storage = getStorage();
const LIMITE = 2 * 1024 * 1024;
const configRef = doc(db, "configuracoes", "conquistas");
let configuracoes = {};
const statusGeral = document.getElementById("statusGeral");
function autorizado(){ try { const u=JSON.parse(localStorage.getItem("usuarioAtual")||"{}"); return u.classificado === true || u.tipo === "professor"; } catch { return false; } }
function escapeHtml(v){return String(v??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;", "'":"&#39;"}[c]));}
function render(){
  document.getElementById("gradeConquistas").innerHTML = regrasDeConquistas.map(c=>{const url=configuracoes[c.id]?.url||"";return `<article class="card" data-id="${c.id}"><div class="preview">${url?`<img src="${escapeHtml(url)}" alt="">`:`<span class="placeholder">🏆</span>`}</div><div><div class="nome">${escapeHtml(c.titulo)}</div><div class="desc">${escapeHtml(c.descricao)}</div></div><div class="acoes"><input class="arquivo" type="file" accept="image/png" data-file="${c.id}"><button data-upload="${c.id}">Enviar PNG</button>${url?`<button class="remover" data-remove="${c.id}">Remover</button>`:""}<span class="status" data-status="${c.id}"></span></div></article>`}).join("");
  document.querySelectorAll("[data-upload]").forEach(b=>b.addEventListener("click",()=>upload(b.dataset.upload,b)));
  document.querySelectorAll("[data-remove]").forEach(b=>b.addEventListener("click",()=>remover(b.dataset.remove,b)));
}
async function carregar(){if(!autorizado()){statusGeral.textContent="Acesso restrito ao professor classificado.";statusGeral.className="status err";document.getElementById("gradeConquistas").innerHTML="<p>Você não tem permissão para editar conquistas.</p>";return}try{const snap=await getDoc(configRef);configuracoes=snap.exists()?snap.data().itens||{}:{};render()}catch(e){console.error(e);statusGeral.textContent="Não foi possível carregar as configurações das conquistas.";statusGeral.className="status err";document.getElementById("gradeConquistas").innerHTML="<p>Erro ao carregar o editor de ícones.</p>"}}
async function upload(id,botao){const input=document.querySelector(`[data-file="${id}"]`), file=input?.files?.[0], status=document.querySelector(`[data-status="${id}"]`);if(!file){status.textContent="Escolha um PNG.";status.className="status err";return}if(file.type!=="image/png"||file.size>LIMITE){status.textContent="Use PNG de até 2 MB.";status.className="status err";return}botao.disabled=true;status.textContent="Enviando...";try{const caminho=`conquistas/${id}.png`;const arquivoRef=ref(storage,caminho);await uploadBytes(arquivoRef,file,{contentType:"image/png",cacheControl:"public,max-age=3600"});const url=await getDownloadURL(arquivoRef);configuracoes[id]={url,caminho,atualizadoEm:new Date().toISOString()};await setDoc(configRef,{itens:configuracoes},{merge:true});status.textContent="Ícone salvo.";status.className="status ok";document.getElementById("barraProgresso").style.width="100%";render()}catch(e){console.error(e);status.textContent="Não foi possível enviar.";status.className="status err"}finally{botao.disabled=false}}
async function remover(id,botao){const status=document.querySelector(`[data-status="${id}"]`);if(!confirm("Remover o ícone desta conquista?"))return;botao.disabled=true;try{const caminho=configuracoes[id]?.caminho||`conquistas/${id}.png`;await deleteObject(ref(storage,caminho)).catch(()=>{});delete configuracoes[id];await setDoc(configRef,{itens:configuracoes},{merge:true});render()}catch(e){status.textContent="Não foi possível remover.";status.className="status err"}finally{botao.disabled=false}}
carregar();
</script>
</body></html>
