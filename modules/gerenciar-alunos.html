<link rel="stylesheet" href="modules/gerenciar-alunos.css">

<h2 class="titulo-modulo">👥 Gerenciar Alunos</h2>

<div class="topo-modulo">
  <button class="btn-add" id="btnAddNovoAluno">➕ Adicionar Aluno</button>
</div>

<div id="loaderGerAlunos" class="loader-gerenciar">Carregando alunos...</div>

<div id="painelGerenciar" class="painel-gerenciar"></div>

<!-- Modal adicionar -->
<div id="modalAddAluno" class="modal-ger">
  <div class="modal-content-ger">
    <h3>Novo Aluno</h3>

    <label>Nome</label>
    <input type="text" id="novoNomeAluno">

    <label for="novoInstrumentoAluno">Instrumento</label>
    <select id="novoInstrumentoAluno" required>
      <option value="">Carregando instrumentos...</option>
    </select>

    <label for="novoInstrumentoParteAluno">Subdivisão (opcional)</label>
    <select id="novoInstrumentoParteAluno">
      <option value="">Sem divisão</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
    </select>

    <label>Foto</label>
    <input type="file" id="novoFotoAluno" accept="image/*">

    <div class="modal-botoes">
      <button id="confirmAddAluno" class="ok">Adicionar</button>
      <button id="cancelAddAluno" class="cancel">Cancelar</button>
    </div>
  </div>
</div>
