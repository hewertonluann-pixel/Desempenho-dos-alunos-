<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="Fases musicais da jornada de aprendizagem.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="loader.css">
  <link rel="stylesheet" href="bottom-nav.css">
  <title>Fases Musicais</title>
  <style>
    :root{--bg:#07111f;--surface:#0d1b2d;--surface2:#11243a;--line:#1d3854;--text:#e8f1f8;--muted:#8da4ba;--cyan:#38d5e8;--green:#42d392;--gold:#f4bd4e;--locked:#52657a}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding:72px 0 88px}
    main{width:min(100% - 32px,720px);margin:0 auto;padding:22px 0 30px}
    .topo{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}
    h1{margin:0;font-size:clamp(1.35rem,4vw,1.8rem);letter-spacing:-.04em}
    .subtitulo{margin:6px 0 0;color:var(--muted);font-size:.86rem}
    .resumo{min-width:120px;text-align:right}.resumo strong{display:block;color:var(--cyan);font-size:1.2rem}.resumo span{color:var(--muted);font-size:.68rem}
    .barra{width:120px;height:5px;margin-top:8px;overflow:hidden;border-radius:99px;background:var(--line)}.barra i{display:block;width:0;height:100%;border-radius:inherit;background:var(--green);transition:width .2s ease}
    .grupo{margin-top:26px}.grupo-titulo{display:flex;align-items:center;gap:9px;margin:0 0 10px;color:var(--muted);font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.grupo-titulo::after{content:"";flex:1;height:1px;background:var(--line)}
    .fases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .fase{position:relative;display:flex;min-width:0;aspect-ratio:1;flex-direction:column;justify-content:space-between;padding:12px;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);text-decoration:none;transition:border-color .15s,background .15s,transform .15s}
    .fase:hover,.fase:focus-visible{outline:none;border-color:var(--cyan);background:var(--surface2);transform:translateY(-2px)}
    .fase-num{color:var(--muted);font-size:.66rem;font-weight:800}.fase-icone{display:grid;width:38px;height:38px;place-items:center;border-radius:11px;background:#142b43;color:var(--cyan);font-size:1.25rem}.fase-nome{display:block;min-height:2.2em;font-size:.76rem;font-weight:750;line-height:1.1}.fase-status{color:var(--muted);font-size:.62rem;font-weight:700}
    .fase-progresso{display:flex;gap:3px;margin-top:7px}.fase-progresso i{flex:1;height:4px;border-radius:99px;background:var(--line)}.fase-progresso i.on{background:var(--cyan)}
    .fase.concluida{border-color:rgba(66,211,146,.6)}.fase.concluida .fase-icone{background:rgba(66,211,146,.14);color:var(--green)}.fase.concluida .fase-status{color:var(--green)}.fase.concluida .fase-progresso i.on{background:var(--green)}
    .fase.andamento{border-color:rgba(56,213,232,.65)}.fase.expirada{border-color:rgba(244,189,78,.65)}.fase.expirada .fase-status{color:var(--gold)}
    .medalha{position:absolute;top:9px;right:9px;display:grid;width:25px;height:25px;place-items:center;border:1px solid var(--line);border-radius:50%;color:var(--locked);font-size:.74rem}.concluida .medalha{border-color:var(--gold);background:rgba(244,189,78,.14);color:var(--gold)}.medalha img{width:18px;height:18px;object-fit:contain}
    .legenda{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px;color:var(--muted);font-size:.68rem}.legenda b{color:var(--text)}
    .erro-jornada{padding:20px;border:1px solid #7f1d1d;border-radius:12px;color:#fecaca;background:#2b1118;font-size:.82rem}
    @media (max-width:540px){main{width:min(100% - 20px,420px);padding-top:14px}.fases{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.fase{padding:9px;border-radius:11px}.fase-icone{width:32px;height:32px;font-size:1rem}.fase-nome{font-size:.68rem}.resumo{min-width:95px}.barra{width:95px}}
    @media (max-width:340px){.topo{display:block}.resumo{margin-top:14px;text-align:left}.fases{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media (prefers-reduced-motion:reduce){.fase,.barra i{transition:none}}
  </style>
</head>
<body>
  <div id="global-loader"><div class="spinner-container"><div class="spinner"></div><div id="emoji-container">🎷</div><div id="verse-container"><div id="verse-text"></div><div id="verse-reference"></div></div></div></div>

  <main>
    <header class="topo">
      <div><h1>Fases Musicais</h1><p class="subtitulo">Escolha uma fase para continuar sua jornada.</p></div>
      <div class="resumo" aria-label="Progresso da jornada"><strong id="jornada-contagem">0 de 9</strong><span>fases concluídas</span><div class="barra" role="progressbar" aria-label="Progresso da jornada" aria-valuemin="0" aria-valuemax="9" aria-valuenow="0"><i id="jornada-barra"></i></div></div>
    </header>

    <section class="grupo" aria-labelledby="titulo-fundamentos"><h2 id="titulo-fundamentos" class="grupo-titulo">Fundamentos</h2><div class="fases" id="fases-fundamentos"></div></section>
    <section class="grupo" aria-labelledby="titulo-desenvolvimento"><h2 id="titulo-desenvolvimento" class="grupo-titulo">Desenvolvimento</h2><div class="fases" id="fases-desenvolvimento"></div></section>
    <section class="grupo" aria-labelledby="titulo-desafio"><h2 id="titulo-desafio" class="grupo-titulo">Desafio final</h2><div class="fases" id="fases-desafio"></div></section>

    <footer class="legenda"><span><b>✓</b> Concluída</span><span><b>▶</b> Em andamento</span><span><b>★</b> Medalha</span><span><b>↺</b> Troféu expirado</span></footer>
  </main>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <a href="aluno.html" class="nav-item" data-page="home"><span class="nav-icon">⌂</span><span class="nav-label">Home</span></a>
    <a href="painel-social.html" class="nav-item" data-page="comunidade"><span class="nav-icon">♧</span><span class="nav-label">Comunidade</span></a>
    <a href="biblioteca.html" class="nav-item" data-page="biblioteca"><span class="nav-icon">▤</span><span class="nav-label">Biblioteca</span></a>
    <a href="atividades.html" class="nav-item active" data-page="atividades"><span class="nav-icon">◆</span><span class="nav-label">Atividades</span></a>
    <a href="professor.html" class="nav-item" data-page="professor" id="navProfessor" style="display:none"><span class="nav-icon">♟</span><span class="nav-label">Professor</span></a>
  </nav>

  <script type="module">
    import { db } from "./firebase-config.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
    import { JORNADA_ATIVIDADES, carregarProgressoJornada, trofeuAtivo, dataExpiracaoTrofeu } from "./jornada-atividades.js";

    const limites = {"notas-musicais":5,"escada-notas":8,"como-funciona-pauta":3,"figuras-musicais":5,"jogo-figuras":10,"atividades-notas":10,"compassos-game":10,"tom-semitom":10,"tetracordes":10};
    const icones = Object.fromEntries(JORNADA_ATIVIDADES.map((atividade) => [atividade.id, atividade.icone]));
    const contagem = document.getElementById("jornada-contagem");
    const barra = document.getElementById("jornada-barra");
    const barraBox = barra.parentElement;
    const cards = new Map();

    function grupoDe(atividade){ return atividade.ordem <= 4 ? "fases-fundamentos" : atividade.ordem <= 8 ? "fases-desenvolvimento" : "fases-desafio"; }
    function progressoDe(registro, atividade, concluida){
      const total = Number(registro.totalEtapas || limites[atividade.id] || 10);
      const salvo = registro.progressoAtual ?? registro.progresso ?? registro.etapasConcluidas ?? registro.passosConcluidos;
      const atual = concluida ? total : Math.max(0, Math.min(total, Number(salvo) || 0));
      return { atual, total };
    }
    function criarCard(atividade){
      const card = document.createElement("a");
      card.className = "fase"; card.href = atividade.url; card.dataset.jornadaId = atividade.id;
      const num = document.createElement("span"); num.className = "fase-num"; num.textContent = `FASE ${String(atividade.ordem).padStart(2,"0")}`;
      const icone = document.createElement("span"); icone.className = "fase-icone"; icone.textContent = icones[atividade.id] || "♪";
      const nomeWrap = document.createElement("span"); const nome = document.createElement("strong"); nome.className = "fase-nome"; nome.textContent = atividade.titulo;
      const status = document.createElement("small"); status.className = "fase-status"; nomeWrap.append(nome,status);
      const medalha = document.createElement("span"); medalha.className = "medalha"; medalha.setAttribute("aria-label","Medalha da fase");
      const progresso = document.createElement("span"); progresso.className = "fase-progresso";
      card.append(num,icone,nomeWrap,medalha,progresso); document.getElementById(grupoDe(atividade)).appendChild(card); cards.set(atividade.id,{card,status,medalha,progresso});
    }
    function aplicar(progressoMapa, medalhas){
      let totalConcluidas = 0;
      for (const atividade of JORNADA_ATIVIDADES){
        const partes = cards.get(atividade.id); if (!partes) continue;
        const registro = progressoMapa[atividade.id] || {}; const concluida = trofeuAtivo(registro); const expirado = registro.concluida === true && !concluida && Boolean(dataExpiracaoTrofeu(registro));
        const p = progressoDe(registro, atividade, concluida); const andamento = !concluida && p.atual > 0;
        partes.card.classList.toggle("concluida",concluida); partes.card.classList.toggle("andamento",andamento); partes.card.classList.toggle("expirada",expirado);
        partes.status.textContent = concluida ? "✓ Concluída" : expirado ? "↺ Troféu expirado" : andamento ? "▶ Em andamento" : "Disponível";
        partes.medalha.replaceChildren();
        const imagem = medalhas?.[atividade.id]?.url;
        if (imagem && concluida){ const img = document.createElement("img"); img.src = imagem; img.alt = `Medalha ${atividade.titulo}`; img.loading = "lazy"; partes.medalha.appendChild(img); } else partes.medalha.textContent = "★";
        partes.progresso.replaceChildren(); const segmentos = Math.min(Math.max(p.total,1),5); const preenchidos = Math.round((p.atual / p.total) * segmentos);
        for(let i=0;i<segmentos;i++){ const item = document.createElement("i"); if(i < preenchidos) item.className = "on"; partes.progresso.appendChild(item); }
        if(concluida) totalConcluidas++;
      }
      const total = JORNADA_ATIVIDADES.length; contagem.textContent = `${totalConcluidas} de ${total}`; barra.style.width = `${total ? totalConcluidas / total * 100 : 0}%`; barraBox.setAttribute("aria-valuenow",String(totalConcluidas));
    }
    JORNADA_ATIVIDADES.forEach(criarCard);
    aplicar({},{});
    Promise.allSettled([carregarProgressoJornada(),getDoc(doc(db,"configuracoes","conquistas"))]).then(([p,c])=>{ const progresso = p.status === "fulfilled" ? p.value : {}; const snap = c.status === "fulfilled" ? c.value : null; aplicar(progresso,snap?.exists() ? snap.data().atividades || {} : {}); }).catch((erro)=>console.error("Não foi possível carregar a jornada",erro));
  </script>
  <script src="loader.js"></script>
  <script type="module" src="bottom-nav.js"></script>
</body>
</html>
