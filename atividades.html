<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="Fases musicais da jornada de aprendizagem.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="loader.css">
  <link rel="stylesheet" href="bottom-nav.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>Fases Musicais</title>
  <style>
    :root{--bg:#050a18;--surface:#0b1328;--surface2:#111d39;--line:#25335a;--text:#f7f9ff;--muted:#aab5cf;--cyan:#35b9ff;--green:#35e18b;--gold:#ffc21c;--locked:#6e7c9f}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0%,#12254d 0,transparent 34%),radial-gradient(circle at 92% 22%,#191342 0,transparent 30%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding:72px 0 88px}
    main{width:min(100% - 32px,1240px);margin:0 auto;padding:28px 0 38px}
    .topo{display:flex;align-items:center;justify-content:space-between;gap:28px;margin-bottom:34px}
    h1{margin:0;font-size:clamp(2rem,4vw,3.25rem);letter-spacing:-.055em;line-height:1}
    .subtitulo{margin:10px 0 0;color:var(--muted);font-size:clamp(.9rem,1.5vw,1.15rem)}
    .resumo{min-width:220px;padding:16px 22px;border:1px solid #31416d;border-radius:20px;background:rgba(13,22,49,.82);box-shadow:0 14px 40px #02061366;text-align:center}.resumo strong{display:block;color:var(--gold);font-size:2rem;line-height:1}.resumo strong small{color:var(--text);font-size:.9rem;font-weight:800}.resumo span{color:var(--muted);font-size:.76rem}.barra{width:100%;height:8px;margin-top:12px;overflow:hidden;border-radius:99px;background:#182444}.barra i{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#ffad18,#ffe15c);box-shadow:0 0 14px #ffc21c99;transition:width .25s ease}
    .grupo{margin-top:34px}.grupo-titulo{display:flex;align-items:center;width:100%;gap:12px;margin:0 0 16px;padding:0;border:0;background:transparent;color:#dbe5ff;font:inherit;font-size:.9rem;font-weight:900;letter-spacing:.16em;text-align:left;text-transform:uppercase;cursor:pointer}.grupo-titulo::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#314573,transparent)}.grupo-titulo:focus-visible{outline:2px solid var(--cyan);outline-offset:5px;border-radius:3px}.grupo-titulo i{width:16px;color:var(--gold);font-size:.8rem;text-align:center;transition:transform .15s ease}.grupo-titulo[aria-expanded="false"] i{transform:rotate(-90deg)}
    .fases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.fases[hidden]{display:none}
    .fase{position:relative;display:flex;min-width:0;min-height:245px;flex-direction:column;justify-content:flex-start;padding:22px 22px 20px;overflow:hidden;border:2px solid color-mix(in srgb,var(--accent) 90%,white 10%);border-radius:24px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 18%,var(--surface)),rgba(7,13,31,.96) 65%);color:var(--text);text-decoration:none;box-shadow:0 14px 30px #02061366, inset 0 -30px 45px color-mix(in srgb,var(--accent) 9%,transparent);transition:border-color .2s,box-shadow .2s,transform .2s}
    .fase::after{content:"";position:absolute;left:-12%;right:35%;bottom:-36px;height:72px;border-radius:50%;border-top:2px solid color-mix(in srgb,var(--accent) 75%,transparent);box-shadow:0 -5px 22px color-mix(in srgb,var(--accent) 35%,transparent);transform:rotate(-7deg);pointer-events:none}
    .fase:hover,.fase:focus-visible{outline:none;border-color:#fff;box-shadow:0 18px 42px #02061399,0 0 24px color-mix(in srgb,var(--accent) 25%,transparent);transform:translateY(-5px)}
    .fase-num{align-self:flex-start;padding:7px 13px;border:1px solid color-mix(in srgb,var(--accent) 70%,white 30%);border-radius:99px;background:color-mix(in srgb,var(--accent) 35%,transparent);color:#fff;font-size:.78rem;font-weight:900;letter-spacing:.04em}.fase-icone{position:absolute;top:23px;right:22px;color:color-mix(in srgb,var(--accent) 75%,white 25%);font-size:2.15rem;filter:drop-shadow(0 4px 8px color-mix(in srgb,var(--accent) 45%,transparent))}.fase-nome{display:block;min-height:2.35em;margin-top:28px;max-width:92%;font-size:clamp(1rem,1.6vw,1.38rem);font-weight:850;line-height:1.13;letter-spacing:-.025em}.fase-status{display:block;margin-top:8px;color:var(--muted);font-size:.76rem;font-weight:750}
    .fase-estrelas{display:block;margin-top:24px;color:#526184;font-size:2.25rem;letter-spacing:3px;line-height:1;text-shadow:0 2px 3px #020613}.fase-estrelas .on{color:var(--gold);text-shadow:0 0 10px #ffc21caa,0 2px 3px #4d3000}
    .fase.concluida .fase-status{color:var(--green)}.fase.andamento .fase-status{color:var(--cyan)}.fase.expirada .fase-status{color:var(--gold)}
    .fase-acessar{position:absolute;right:20px;bottom:17px;z-index:1;display:grid;width:38px;height:38px;place-items:center;border:1px solid color-mix(in srgb,var(--accent) 70%,white 30%);border-radius:50%;background:color-mix(in srgb,var(--accent) 32%,transparent);color:#fff;font-size:1.35rem;font-weight:500}
    .legenda{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px;color:var(--muted);font-size:.68rem}.legenda b{color:var(--text)}
    .erro-jornada{padding:20px;border:1px solid #7f1d1d;border-radius:12px;color:#fecaca;background:#2b1118;font-size:.82rem}
    @media (max-width:900px){.fases{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media (max-width:680px){main{width:min(100% - 22px,520px);padding-top:16px}.topo{display:block;margin-bottom:26px}.resumo{margin-top:18px;min-width:0;text-align:left}.barra{width:100%}.fases{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fase{min-height:210px;padding:16px 15px 16px;border-radius:19px}.fase-icone{top:17px;right:15px;font-size:1.7rem}.fase-num{padding:6px 9px;font-size:.67rem}.fase-nome{margin-top:22px;font-size:clamp(.86rem,3.6vw,1.05rem)}.fase-estrelas{margin-top:18px;font-size:1.7rem;letter-spacing:1px}.fase-acessar{right:13px;bottom:12px;width:31px;height:31px;font-size:1.05rem}.grupo{margin-top:27px}.grupo-titulo{font-size:.76rem}}
    @media (max-width:380px){.fases{grid-template-columns:1fr}.fase{min-height:190px}.fase-nome{font-size:1rem}}
    @media (prefers-reduced-motion:reduce){.fase,.barra i,.grupo-titulo i{transition:none}}
  </style>
</head>
<body>
  <div id="global-loader"><div class="spinner-container"><div class="spinner"></div><div id="emoji-container">🎷</div><div id="verse-container"><div id="verse-text"></div><div id="verse-reference"></div></div></div></div>

  <main>
    <header class="topo">
      <div><h1><span aria-hidden="true">♫</span> Fases Musicais</h1><p class="subtitulo">Escolha uma fase para continuar sua jornada.</p></div>
      <div class="resumo" aria-label="Progresso da jornada"><strong><span aria-hidden="true">★</span> <span id="jornada-estrelas">0</span> <small>de 30</small></strong><span id="jornada-contagem">0 de 10 fases</span><div class="barra" role="progressbar" aria-label="Progresso da jornada" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><i id="jornada-barra"></i></div></div>
    </header>

    <section class="grupo" aria-labelledby="titulo-fundamentos"><button type="button" class="grupo-titulo" id="titulo-fundamentos" aria-expanded="true" aria-controls="fases-fundamentos"><i class="fa-solid fa-chevron-down" aria-hidden="true"></i><span>Fundamentos</span></button><div class="fases" id="fases-fundamentos"></div></section>
    <section class="grupo" aria-labelledby="titulo-desenvolvimento"><button type="button" class="grupo-titulo" id="titulo-desenvolvimento" aria-expanded="true" aria-controls="fases-desenvolvimento"><i class="fa-solid fa-chevron-down" aria-hidden="true"></i><span>Desenvolvimento</span></button><div class="fases" id="fases-desenvolvimento"></div></section>
    <section class="grupo" aria-labelledby="titulo-desafio"><button type="button" class="grupo-titulo" id="titulo-desafio" aria-expanded="true" aria-controls="fases-desafio"><i class="fa-solid fa-chevron-down" aria-hidden="true"></i><span>Desafio final</span></button><div class="fases" id="fases-desafio"></div></section>

    <footer class="legenda"><span><b>★</b> nível alcançado</span><span><b>☆</b> ainda não conquistada</span><span><b>↺</b> resultado expirado</span></footer>
  </main>

  <nav class="bottom-nav">
    <a href="aluno.html" class="nav-item" data-page="home"><i class="fas fa-home nav-icon"></i><span class="nav-label">Home</span></a>
    <a href="painel-social.html" class="nav-item" data-page="comunidade"><i class="fas fa-users nav-icon"></i><span class="nav-label">Comunidade</span></a>
    <a href="biblioteca.html" class="nav-item" data-page="biblioteca"><i class="fas fa-book nav-icon"></i><span class="nav-label">Biblioteca</span></a>
    <a href="atividades.html" class="nav-item" data-page="atividades"><i class="fas fa-clipboard-list nav-icon"></i><span class="nav-label">Atividades</span></a>
    <a href="professor.html" class="nav-item" data-page="professor" id="navProfessor" style="display:none;"><i class="fas fa-chalkboard-teacher nav-icon"></i><span class="nav-label">Professor</span></a>
  </nav>

  <script type="module">
    import { db } from "./firebase-config.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
    import { JORNADA_ATIVIDADES, carregarProgressoJornada, trofeuAtivo, dataExpiracaoTrofeu } from "./jornada-atividades.js";

    const limites = {"notas-musicais":5,"escada-notas":8,"como-funciona-pauta":3,"figuras-musicais":5,"jogo-figuras":10,"atividades-notas":10,"compassos-game":10,"tom-semitom":10,"tetracordes":10,"atividades-armadura":11};
    const icones = Object.fromEntries(JORNADA_ATIVIDADES.map((atividade) => [atividade.id, atividade.icone]));
    const contagem = document.getElementById("jornada-contagem");
    const estrelasJornada = document.getElementById("jornada-estrelas");
    const barra = document.getElementById("jornada-barra");
    const barraBox = barra.parentElement;
    const cards = new Map();

    function grupoDe(atividade){ return atividade.ordem <= 4 ? "fases-fundamentos" : atividade.ordem <= 8 ? "fases-desenvolvimento" : "fases-desafio"; }
    function progressoDe(registro, atividade, concluida){
      const total = Number(registro.totalEtapas || limites[atividade.id] || 10);
      const salvo = registro.progressoAtual ?? registro.progresso ?? registro.etapasConcluidas ?? registro.passosConcluidos;
      const atual = concluida ? total : Math.max(0, Math.min(total, Number(salvo) || 0));
      return { atual, total };
    }
    function criarCard(atividade){
      const card = document.createElement("a");
      card.className = "fase"; card.href = atividade.url; card.dataset.jornadaId = atividade.id;
      const num = document.createElement("span"); num.className = "fase-num"; num.textContent = `FASE ${String(atividade.ordem).padStart(2,"0")}`;
      const icone = document.createElement("span"); icone.className = "fase-icone"; icone.textContent = icones[atividade.id] || "♪";
      const nomeWrap = document.createElement("span"); const nome = document.createElement("strong"); nome.className = "fase-nome"; nome.textContent = atividade.titulo;
      const status = document.createElement("small"); status.className = "fase-status"; nomeWrap.append(nome,status);
      const estrelas = document.createElement("span"); estrelas.className = "fase-estrelas"; estrelas.setAttribute("aria-label", "0 de 3 estrelas"); estrelas.textContent = "☆☆☆";
      const acessar = document.createElement("span"); acessar.className = "fase-acessar"; acessar.setAttribute("aria-hidden", "true"); acessar.textContent = "→";
      const paletas = ["#249eff","#21dc83","#a855f7","#f59e0b"];
      card.style.setProperty("--accent", paletas[(atividade.ordem - 1) % paletas.length]);
      card.append(num,icone,nomeWrap,status,estrelas,acessar); document.getElementById(grupoDe(atividade)).appendChild(card); cards.set(atividade.id,{card,status,estrelas});
    }
    function aplicar(progressoMapa, medalhas){
      let totalConcluidas = 0;
      let totalEstrelas = 0;
      for (const atividade of JORNADA_ATIVIDADES){
        const partes = cards.get(atividade.id); if (!partes) continue;
        const registro = progressoMapa[atividade.id] || {}; const concluida = trofeuAtivo(registro); const expirado = registro.concluida === true && !concluida && Boolean(dataExpiracaoTrofeu(registro));
        const p = progressoDe(registro, atividade, concluida); const andamento = !concluida && p.atual > 0;
        partes.card.classList.toggle("concluida",concluida); partes.card.classList.toggle("andamento",andamento); partes.card.classList.toggle("expirada",expirado);
        partes.status.textContent = concluida ? "Concluída" : expirado ? "Resultado expirado" : andamento ? "Em andamento" : "Disponível";
        const quantidadeEstrelas = Math.min(Math.max(Number(registro.estrelas) || 0, 0), 3);
        totalEstrelas += quantidadeEstrelas;
        partes.estrelas.innerHTML = `<span class="on">${"★".repeat(quantidadeEstrelas)}</span>${"☆".repeat(3 - quantidadeEstrelas)}`;
        partes.estrelas.setAttribute("aria-label", `${quantidadeEstrelas} de 3 estrelas`);
        if(concluida) totalConcluidas++;
      }
      const total = JORNADA_ATIVIDADES.length; contagem.textContent = `${totalConcluidas} de ${total} fases`; estrelasJornada.textContent = totalEstrelas; barra.style.width = `${total ? totalConcluidas / total * 100 : 0}%`; barraBox.setAttribute("aria-valuenow",String(totalConcluidas));
    }
    document.querySelectorAll(".grupo-titulo").forEach((titulo) => {
      titulo.addEventListener("click", () => {
        const aberto = titulo.getAttribute("aria-expanded") === "true";
        titulo.setAttribute("aria-expanded", String(!aberto));
        document.getElementById(titulo.getAttribute("aria-controls")).hidden = aberto;
      });
    });
    JORNADA_ATIVIDADES.forEach(criarCard);
    aplicar({},{});
    Promise.allSettled([carregarProgressoJornada(),getDoc(doc(db,"configuracoes","conquistas"))]).then(([p,c])=>{ const progresso = p.status === "fulfilled" ? p.value : {}; const snap = c.status === "fulfilled" ? c.value : null; aplicar(progresso,snap?.exists() ? snap.data().atividades || {} : {}); }).catch((erro)=>console.error("Não foi possível carregar a jornada",erro));
  </script>
  <script src="loader.js"></script>
  <script type="module" src="bottom-nav.js"></script>
</body>
</html>
